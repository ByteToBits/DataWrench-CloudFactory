---
- name: Baseline SSH hardening
  hosts: all
  become: true
  tasks:
    - name: Deploy sshd hardening drop-in
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          PermitRootLogin no
          PasswordAuthentication yes
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted