---
# Forms the etcd + Patroni cluster on hosts already prepared by the postgres_patroni role.
# Credentials come from vars/patroni.vault.yml, loaded by the playbook.

- name: Require vaulted credentials
  ansible.builtin.assert:
    that:
      - patroni_superuser_password | default('', true) | string | length >= postgres_patroni_cluster_min_password_length
      - patroni_replication_password | default('', true) | string | length >= postgres_patroni_cluster_min_password_length
      - patroni_rewind_password | default('', true) | string | length >= postgres_patroni_cluster_min_password_length
      - patroni_restapi_password | default('', true) | string | length >= postgres_patroni_cluster_min_password_length
    fail_msg: >-
      Missing or short Patroni passwords. Check vars/patroni.vault.yml
      ({{ postgres_patroni_cluster_min_password_length }}+ characters each, values quoted).
    quiet: true
  no_log: true

- name: Require an odd number of members
  ansible.builtin.assert:
    that:
      - postgres_patroni_cluster_members | length is odd
    fail_msg: "etcd needs an odd member count for quorum; the patroni group has {{ postgres_patroni_cluster_members | length }}."
    quiet: true
  run_once: true

- name: Open cluster ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ postgres_patroni_cluster_firewall_ports }}"

# --- etcd ---------------------------------------------------------------------

- name: Write etcd config
  ansible.builtin.template:
    src: etcd.conf.j2
    dest: /etc/etcd/etcd.conf
    owner: root
    group: etcd
    mode: "0640"

# All members must start together: each waits for the others before reporting ready
- name: Start etcd on all members
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
    no_block: true

- name: Wait for a healthy etcd cluster
  ansible.builtin.command:
    cmd: >-
      {{ postgres_patroni_cluster_etcdctl }} endpoint health --cluster
      --endpoints=http://{{ ansible_host }}:2379
  register: postgres_patroni_cluster_etcd_health
  until: postgres_patroni_cluster_etcd_health.rc == 0
  retries: 24
  delay: 5
  changed_when: false
  run_once: true

- name: List etcd members
  ansible.builtin.command:
    cmd: "{{ postgres_patroni_cluster_etcdctl }} member list --endpoints=http://{{ ansible_host }}:2379"
  register: postgres_patroni_cluster_etcd_members
  changed_when: false
  run_once: true

# Catches a node that still carries an old single-member cluster (e.g. a hand-built db-01)
- name: Require every host to be an etcd member
  ansible.builtin.assert:
    that:
      - postgres_patroni_cluster_etcd_members.stdout_lines | length == postgres_patroni_cluster_members | length
      - postgres_patroni_cluster_members | reject('in', postgres_patroni_cluster_etcd_members.stdout) | list | length == 0
    fail_msg: >-
      etcd membership does not match the patroni group. A host has stale etcd state —
      run playbooks/postgres_patroni_reset.yml on it (see README).
    quiet: true
  run_once: true

# --- Patroni ------------------------------------------------------------------

- name: Ensure PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_patroni_cluster_pg_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write Patroni config
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload Patroni

# The PGDG unit has no restart policy: if etcd isn't up yet at boot, Patroni exits for good
- name: Create Patroni systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/patroni.service.d
    state: directory
    mode: "0755"

- name: Make Patroni wait for etcd and retry on failure
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service.d/10-etcd-restart.conf
    content: |
      # Managed by Ansible (roles/postgres_patroni_cluster)
      [Unit]
      After=etcd.service
      Wants=etcd.service
      StartLimitIntervalSec=0

      [Service]
      Restart=on-failure
      RestartSec=10
    mode: "0644"
  notify: Reload systemd

- name: Start Patroni on the bootstrap host
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
  when: inventory_hostname == postgres_patroni_cluster_bootstrap_host

- name: Wait for the cluster to have a leader
  ansible.builtin.uri:
    url: "http://{{ hostvars[postgres_patroni_cluster_bootstrap_host].ansible_host }}:8008/cluster"
    return_content: true
  register: postgres_patroni_cluster_state
  until: >-
    postgres_patroni_cluster_state.json is defined and
    'leader' in (postgres_patroni_cluster_state.json.members | map(attribute='role') | list)
  retries: 30
  delay: 5
  run_once: true

- name: Start Patroni on the remaining members
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
  when: inventory_hostname != postgres_patroni_cluster_bootstrap_host

# Replicas clone the leader with pg_basebackup first; allow time on a large database
- name: Wait for every member to be running
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:8008/health"
  register: postgres_patroni_cluster_health
  until: postgres_patroni_cluster_health.status == 200
  retries: 60
  delay: 10
