---
# HAProxy + keepalived on every control plane. Nodes and kubectl connect to the virtual IP:
#   <vip>:8443 → HAProxy → kube-apiserver :6443 on any healthy control plane
# Runs before `kubeadm init`: until then HAProxy listens but has no healthy backends.

- name: Gather service state
  ansible.builtin.service_facts:

# firewalld would drop VRRP between the nodes and every one would claim the VIP
- name: Require firewalld to be off
  ansible.builtin.assert:
    that:
      - ansible_facts.services['firewalld.service'].state | default('') != 'running'
    fail_msg: firewalld is running. Run playbooks/k8s_node.yml first, which disables it on Kubernetes nodes.
    quiet: true

- name: Install HAProxy and keepalived
  ansible.builtin.dnf:
    name:
      - haproxy
      - keepalived
    state: present

- name: Note whether keepalived is already running here
  ansible.builtin.set_fact:
    k8s_control_plane_haproxy_keepalived_running: >-
      {{ ansible_facts.services['keepalived.service'].state | default('') == 'running' }}

# Before keepalived first claims the VIP, nothing should answer on it
- name: Check the virtual IP is not already in use
  ansible.builtin.command:
    cmd: "ping -c 2 -W 1 {{ k8s_control_plane_haproxy_vip }}"
  register: k8s_control_plane_haproxy_vip_ping
  changed_when: false
  failed_when: false
  run_once: true
  when: >-
    ansible_play_hosts
    | map('extract', hostvars, 'k8s_control_plane_haproxy_keepalived_running')
    | select | list | length == 0

- name: Refuse to take a virtual IP that another machine answers on
  ansible.builtin.assert:
    that:
      - k8s_control_plane_haproxy_vip_ping.rc != 0
    fail_msg: >-
      {{ k8s_control_plane_haproxy_vip }} already answers ping and keepalived is not running here.
      Another machine owns it — pick a free address in k8s_control_plane_haproxy_vip.
    quiet: true
  run_once: true
  when: k8s_control_plane_haproxy_vip_ping is not skipped

# RHEL's SELinux policy only lets HAProxy connect to a few ports; it must reach 6443
- name: Allow HAProxy to use any port under SELinux
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Write HAProxy config
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reload HAProxy

- name: Write keepalived config
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart keepalived

- name: Start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true

- name: Start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true

- name: Apply config changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for the virtual IP to accept connections
  ansible.builtin.wait_for:
    host: "{{ k8s_control_plane_haproxy_vip }}"
    port: "{{ k8s_control_plane_haproxy_port }}"
    timeout: 60
  run_once: true

- name: Read addresses on the VIP interface
  ansible.builtin.command:
    cmd: "ip -4 -br addr show dev {{ k8s_control_plane_haproxy_interface }}"
  register: k8s_control_plane_haproxy_addrs
  changed_when: false

- name: Require exactly one node to hold the virtual IP
  ansible.builtin.assert:
    that:
      - k8s_control_plane_haproxy_holders | length == 1
    fail_msg: "VIP held by {{ k8s_control_plane_haproxy_holders | length }} nodes: {{ k8s_control_plane_haproxy_holders }}"
    success_msg: "VIP {{ k8s_control_plane_haproxy_vip }} is on {{ k8s_control_plane_haproxy_holders | first | default('none') }}"
  vars:
    k8s_control_plane_haproxy_holders: >-
      {{ ansible_play_hosts
         | select('in', k8s_control_plane_haproxy_members)
         | map('extract', hostvars)
         | selectattr('k8s_control_plane_haproxy_addrs.stdout', 'search', k8s_control_plane_haproxy_vip ~ '/')
         | map(attribute='inventory_hostname') | list }}
  run_once: true
