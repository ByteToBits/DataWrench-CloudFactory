---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Set kubernetes sysctls
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    dest: /etc/sysctl.d/99-k8s.conf
    mode: "0644"
  notify: Reload sysctl

- name: Add Kubernetes repo
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_node_kubernetes_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_node_kubernetes_version }}/rpm/repodata/repomd.xml.key"
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Add CRI-O repo
  ansible.builtin.yum_repository:
    name: cri-o
    description: CRI-O
    baseurl: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ k8s_node_crio_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ k8s_node_crio_version }}/rpm/repodata/repomd.xml.key"
    exclude: cri-o

- name: Install container tooling
  ansible.builtin.dnf:
    name:
      - "cri-o-{{ k8s_node_crio_patch_version }}"
      - container-selinux
      - podman
      - skopeo
      - buildah
      - qemu-guest-agent
      - iproute-tc
    state: present
    allow_downgrade: true
    disable_excludes: cri-o

- name: Install Kubernetes packages
  ansible.builtin.dnf:
    name:
      - "kubelet-{{ k8s_node_kubernetes_patch_version }}"
      - "kubeadm-{{ k8s_node_kubernetes_patch_version }}"
      - "kubectl-{{ k8s_node_kubernetes_patch_version }}"
      - cri-tools
    state: present
    allow_downgrade: true
    disable_excludes: kubernetes

- name: Enable CRI-O and guest agent
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - crio
    - qemu-guest-agent

# Cilium manages packet filtering on Kubernetes nodes; firewalld would fight it.
# Network filtering for these nodes happens on the FortiGate instead.
- name: Gather service state
  ansible.builtin.service_facts:

- name: Stop and disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: "'firewalld.service' in ansible_facts.services"

- name: Check whether this node has already joined a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_node_kubelet_conf

# Golden image only. Masking kubelet on a node that has joined would take it out of the
# cluster at its next restart, so re-runs leave joined nodes alone.
- name: Mask kubelet until cluster init
  ansible.builtin.systemd:
    name: kubelet
    enabled: false
    masked: true
  when: not k8s_node_kubelet_conf.stat.exists

- name: Pre-pull control plane images
  ansible.builtin.command: >-
    kubeadm config images pull
    --kubernetes-version v{{ k8s_node_kubernetes_patch_version }}
    --cri-socket unix:///var/run/crio/crio.sock
  register: k8s_node_image_pull
  changed_when: "'already present' not in k8s_node_image_pull.stdout"
