---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Set kubernetes sysctls
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    dest: /etc/sysctl.d/99-k8s.conf
    mode: "0644"
  notify: Reload sysctl

- name: Add Kubernetes repo
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key"
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Add CRI-O repo
  ansible.builtin.yum_repository:
    name: cri-o
    description: CRI-O
    baseurl: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version }}/rpm/repodata/repomd.xml.key"
    exclude: cri-o

- name: Install container tooling
  ansible.builtin.dnf:
    name:
      - "cri-o-{{ crio_patch_version }}"
      - container-selinux
      - podman
      - skopeo
      - buildah
      - qemu-guest-agent
      - iproute-tc
    state: present
    disable_excludes: cri-o

- name: Install Kubernetes packages
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - cri-tools
    state: present
    disable_excludes: kubernetes

- name: Enable CRI-O and guest agent
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - crio
    - qemu-guest-agent

- name: Mask kubelet until cluster init
  ansible.builtin.systemd:
    name: kubelet
    enabled: false
    masked: true

- name: Pre-pull control plane images
  ansible.builtin.command: >-
    kubeadm config images pull
    --kubernetes-version v{{ k8s_patch_version }}
    --cri-socket unix:///var/run/crio/crio.sock
  register: pull
  changed_when: "'already present' not in pull.stdout"